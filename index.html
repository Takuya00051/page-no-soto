<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>京都文学マップ — 小説の聖地を巡る</title>
  <meta name="description" content="京都を舞台にした小説の登場スポットを地図で巡るサイト" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <header class="site-header">
        <img src="logo.png" alt="頁の外 PAGE NO SOTO" class="site-logo">
        <p class="tagline">ページの外を、地図で巡る。</p>
      </header>

      <section class="spot-search-section">
        <h2>場所で探す</h2>
        <p class="hint">場所の名前で検索すると、地図がそこへ移動し、関連する作品に自動でチェックが入ります。</p>
        <div class="spot-search-wrap">
          <input id="spot-search" class="work-search" type="search" placeholder="例: 糺の森" autocomplete="off">
          <ul id="spot-search-results" class="spot-search-results" hidden></ul>
        </div>
      </section>

      <section class="works-section">
        <h2>作品を選ぶ</h2>
        <p class="hint">チェックした作品の登場スポットが地図に表示されます。複数選ぶと、共有されている場所のピンが作品色の扇形になります。</p>

        <input id="work-search" class="work-search" type="search" placeholder="作品名・著者名で検索">
        <div class="work-sort">
          <span>並び替え:</span>
          <select id="work-sort-key">
            <option value="default">追加順</option>
            <option value="author">著者名</option>
            <option value="title">作品名</option>
            <option value="year">刊行年</option>
          </select>
        </div>

        <ul class="work-list" id="work-list"></ul>
        <button id="fit-pins" class="fit-pins-btn">表示中のピンに画面を合わせる</button>
      </section>

      <footer class="site-footer">
        <p>地図: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> / Leaflet</p>
      </footer>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="メニューを開閉">☰ 作品</button>

    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="landmarks.js"></script>
  <script src="app.js"></script>
  <script src="editor.js"></script>
</body>
</html>
